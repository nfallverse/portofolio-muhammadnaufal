<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1814" />
      <stop offset="50%" stop-color="#2a201a" />
      <stop offset="100%" stop-color="#14100d" />
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg)" />
  <!-- Table Plane -->
  <polygon points="40,270 560,270 600,360 0,360" fill="#120e0c" />
  
  <!-- Low Poly Water Bottle -->
  <g transform="translate(140, 70)">
    <polygon points="40,195 80,195 85,90 70,60 70,40 50,40 50,60 35,90" fill="url(#bottle)" opacity="0.85" stroke="#7dd3fc" stroke-width="2" />
    <rect x="47" y="30" width="26" height="15" rx="3" fill="#0369a1" />
  </g>

  <!-- Low Poly Woven Basket & Apple -->
  <g transform="translate(260, 110)">
    <!-- Basket -->
    <polygon points="10,120 130,120 110,165 30,165" fill="#b45309" stroke="#f59e0b" stroke-width="2.5" />
    <!-- Apple -->
    <circle cx="70" cy="110" r="28" fill="#ef4444" stroke="#dc2626" stroke-width="2" />
    <path d="M70,82 Q74,70 82,68" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Snack Bag & Glass -->
  <g transform="translate(420, 100)">
    <!-- Snack -->
    <rect x="10" y="30" width="65" height="110" rx="6" fill="#ea580c" stroke="#f97316" stroke-width="2" />
    <rect x="20" y="55" width="45" height="24" rx="3" fill="#fef08a" />
    <!-- Glass -->
    <polygon points="90,160 135,160 145,85 80,85" fill="#f5f5f4" opacity="0.25" stroke="#f5f5f4" stroke-width="2" />
  </g>

  <!-- Placeholder Badge -->
  <rect x="180" y="300" width="240" height="32" rx="16" fill="#0c0a09" stroke="#e86a33" stroke-width="1.2" opacity="0.9" />
  <text x="300" y="321" fill="#fba76a" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
    + Simpan: assets/proyek2.png
  </text>
</svg>
