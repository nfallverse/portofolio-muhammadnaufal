<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141118" />
      <stop offset="50%" stop-color="#1f1828" />
      <stop offset="100%" stop-color="#0c0a10" />
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e86a33" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgCar)" />
  <!-- Ground -->
  <polygon points="50,260 550,260 600,360 0,360" fill="#0d0a12" />
  
  <!-- Low Poly Car -->
  <g transform="translate(110, 70)">
    <!-- Cabin Roof -->
    <polygon points="120,80 230,80 290,130 80,130" fill="#1e1824" stroke="#e86a33" stroke-width="1.8" />
    <!-- Windshield -->
    <polygon points="215,86 230,86 280,126 215,126" fill="#38bdf8" opacity="0.6" />
    <!-- Lower Body -->
    <polygon points="40,130 330,130 350,175 30,175" fill="url(#carBody)" stroke="#fba76a" stroke-width="2" />
    <!-- Hood / Front Bumper -->
    <polygon points="330,130 350,175 340,185 290,185" fill="#c24d1a" />
    <!-- Wheels -->
    <circle cx="100" cy="180" r="30" fill="#18151f" stroke="#e86a33" stroke-width="3" />
    <circle cx="100" cy="180" r="14" fill="#382d27" />
    <circle cx="270" cy="180" r="30" fill="#18151f" stroke="#e86a33" stroke-width="3" />
    <circle cx="270" cy="180" r="14" fill="#382d27" />
  </g>

  <!-- Placeholder Badge -->
  <rect x="180" y="300" width="240" height="32" rx="16" fill="#0c0a09" stroke="#e86a33" stroke-width="1.2" opacity="0.9" />
  <text x="300" y="321" fill="#fba76a" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
    + Simpan: assets/proyek3.png
  </text>
</svg>
